name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.99.0
      - name: Formatting
        run: cargo fmt --package kyouko-player -- --check
      - name: Check
        run: cargo check --locked
      - name: Third-party licenses and source availability
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/check-third-party.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/test-third-party.ps1
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release
      - name: Embedded executable icon
        run: |
          $env:KYOUKO_ICON_VERIFY_EXE = (Resolve-Path target/release/kyouko-player.exe).Path
          cargo test --locked windows_loads_embedded_icon_id_one_at_every_resolution
      - name: Release logging
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kyouko-logging-selftest'
          cargo test --locked --release release_logger_flushes_on_shutdown
      - name: Duplicate release launch
        run: |
          $env:KYOUKO_INSTANCE_VERIFY_EXE = (Resolve-Path target/release/kyouko-player.exe).Path
          cargo test --locked duplicate_release_launch_exits_without_touching_state_or_log -- --ignored
