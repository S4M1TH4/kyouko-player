[package]
name = "kyouko-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "The mountain echo; only heard, never seen. A zero-resource, event-driven audio player."

# ── Dependency policy ────────────────────────────────────────────────────────
# No async runtime, no GUI toolkit, no rodio, no tracing. Every dependency must
# pull its weight or it gets deleted. `yt-dlp` is spawned via std::process —
# no crate needed for YouTube.

[dependencies]
# Raw Win32. Only the feature gates we actually touch; additive for the
# Win32 overlay module. No abstraction layers on top of this.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_Media_Audio", # default endpoint notifications for event-driven hot-swap
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell", # DragQueryFileW/HDROP for OLE file and folder drops
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }

# Audio output. cpal on Windows = WASAPI in event-driven shared mode: the OS
# wakes the callback only when it needs samples, and `Stream::pause()` stops
# the callback entirely (true zero-CPU pause). Cross-platform by construction,
# so the future Linux port keeps this module untouched.
cpal = "0.18.2" # WASAPI failed-worker cleanup and default-device recovery fixes

# Decoding. Defaults off — we ship exactly the codecs we play, nothing else.
# `isomp4`+`aac` covers yt-dlp's format 140 (m4a); `mkv` covers webm/matroska
# video pulled in as audio. Video containers decode audio-only by design.
# Opus is not enabled; network sources select AAC. The local extension filter
# in broker.rs must match these enabled container readers.
# `opt-simd` enables symphonia's SSE/AVX decode paths.
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "aac",
    "flac",
    "wav",
    "pcm",
    "adpcm",
    "ogg",
    "vorbis",
    "isomp4",
    "mkv",
    "opt-simd",
] }

# Bounded control/status/metadata channels, outside the sample and error
# callbacks. PCM and EOF use atomic queues/mailboxes, with address-based wakes.
crossbeam-channel = "0.5"
atomic-wait = "1.1" # WaitOnAddress/WakeByAddressSingle; no spinning or callback waiter mutex
serde_json = "1" # decode escaped playlist titles without splitting songs at newlines
windows-core = "0.62"

[build-dependencies]
winres = "0.1.12" # compile the executable's Windows icon/version resources

[profile.release]
opt-level = 3        # "z" would starve the decode loop; 3 keeps biquads + symphonia fast
lto = "fat"
codegen-units = 1
panic = "abort"      # no unwind tables anywhere; a panic is a bug, we abort
strip = "symbols"

[profile.dev]
opt-level = 1        # decoder stays usable when debugging from the terminal

[patch.crates-io]
# Pinned WASAPI startup observation only; never modify the Cargo registry.
cpal = { path = "vendor/cpal" }

[features]
default = ["output-realtime"]
output-realtime = ["cpal/realtime"]
# Finite full-application assessment; absent from ordinary builds.
release-diagnostics = ["windows/Win32_System_ProcessStatus"]
