# Local CPAL 0.18.2 source subset: Windows WASAPI and Linux desktop audio.
# See OUTPUT_STARTUP_PATCH.md and PLATFORM_SCOPE.md for provenance and scope.

[package]
edition = "2021"
rust-version = "1.85"
name = "cpal"
version = "0.18.2"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Low-level cross-platform audio I/O library."
documentation = "https://docs.rs/cpal"
readme = "README.md"
keywords = [
    "audio",
    "sound",
    "playback",
    "recording",
    "cross-platform",
]
categories = ["multimedia::audio"]
license = "Apache-2.0"
repository = "https://github.com/RustAudio/cpal"

[package.metadata.docs.rs]
features = ["pipewire", "pulseaudio", "realtime", "realtime-dbus"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[badges.maintenance]
status = "actively-developed"

[features]
default = []
pipewire = ["dep:pipewire"]
pulseaudio = ["dep:pulseaudio", "dep:futures", "dep:portable-atomic"]
realtime = ["dep:audio_thread_priority", "dep:alsa-sys"]
realtime-dbus = ["realtime", "audio_thread_priority/with_dbus"]

[lib]
name = "cpal"
path = "src/lib.rs"

[dependencies.dasp_sample]
version = "0.11"

[target.'cfg(target_os = "linux")'.dependencies.alsa]
version = "0.11"

[target.'cfg(target_os = "linux")'.dependencies.alsa-sys]
version = "0.4"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.audio_thread_priority]
version = "0.35"
optional = true
default-features = false

[target.'cfg(target_os = "linux")'.dependencies.futures]
version = "0.3"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.libc]
version = "0.2"

[target.'cfg(target_os = "linux")'.dependencies.pipewire]
version = "0.10"
features = ["v0_3_53"]
optional = true

[target.'cfg(target_os = "linux")'.dependencies.pulseaudio]
version = "0.3"
optional = true

[target.'cfg(not(target_has_atomic = "64"))'.dependencies.portable-atomic]
version = "1"
optional = true

[target.'cfg(target_os = "windows")'.dependencies.audio_thread_priority]
version = "0.35"
optional = true
default-features = false

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Foundation",
    "Win32_Devices_Properties",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_Media_Multimedia",
    "Win32_UI_Shell_PropertiesSystem",
]

[target.'cfg(target_os = "windows")'.dependencies.windows-core]
version = "0.62"
